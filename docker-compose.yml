services:
  epic-auth-postgres:
    image: postgres:16-alpine
    container_name: epic-auth-postgres
    environment:
      POSTGRES_DB: epic-auth-service
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d epic-auth-service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-internal

  epic-user-service-postgres:
    image: postgres:16-alpine
    container_name: epic-user-service-postgres
    environment:
      POSTGRES_DB: epic_user_service
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d epic_user_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user-internal

  epic-order-postgres:
    image: postgres:16-alpine
    container_name: epic-order-postgres
    environment:
      POSTGRES_DB: epic_order_service
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d epic_order_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - order-internal

  redis:
    image: redis:7-alpine
    container_name: epic-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cache

  epic-auth-service:
    build: ../epic-auth-service/epic-auth-service
    container_name: epic-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      USER_SERVICE_URL: http://epic-user-service:8080
    depends_on:
      epic-auth-postgres:
        condition: service_healthy
    networks:
      - inno-net
      - auth-internal

  epic-user-service:
    build: ../epic-user-service/epic-user-service
    container_name: epic-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      epic-user-service-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inno-net
      - user-internal
      - cache

  epic-order-service:
    build: ../epic-order-service/epic-order-service
    container_name: epic-order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://epic-order-postgres:5432/${ORDER_DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://epic-user-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      epic-order-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      epic-user-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - inno-net
      - order-internal
      - cache

  epic-payment-service:
    build: ../epic-payment-service/epic-payment-service
    image: epic-payment-service:0.0.1
    container_name: epic-payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MONGODB_URI: mongodb://epic-payment-mongo:27017/epic_payment_service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      epic-payment-mongo:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - inno-net
      - payment-internal

  gateway:
    build: ../gateway/gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URI: http://epic-auth-service:8080
      USER_SERVICE_URI: http://epic-user-service:8080
      ORDER_SERVICE_URI: http://epic-order-service:8082
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_SERVICE_URI: http://epic-payment-service:8084
    depends_on:
      - epic-auth-service
      - epic-user-service
      - epic-order-service
    networks:
      - inno-net

  epic-payment-mongo:
    image: mongo:7.0
    container_name: epic-payment-mongo
    volumes:
      - payment-mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment-internal

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - inno-net

volumes:
  auth-postgres-data:
  user-postgres-data:
  order-postgres-data:
  payment-mongo-data:

networks:
  inno-net:
  auth-internal:
  user-internal:
  order-internal:
  cache:
  payment-internal:
